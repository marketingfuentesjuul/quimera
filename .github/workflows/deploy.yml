# -----------------------------------------------------------------------------
# QUIMERA SITE - AUTOMATED DEPLOYMENT WORKFLOW (GITHUB ACTIONS)
# Este workflow se ejecuta automáticamente ante cada push a la rama 'main'.
# Compila la aplicación de React y sube los archivos al servidor SiteGround.
# -----------------------------------------------------------------------------

name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧰 Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build React App
        run: npm run build

      - name: 🚀 Sync files to SiteGround via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SITEGROUND_SFTP_SERVER }}
          username: ${{ secrets.SITEGROUND_SFTP_USERNAME }}
          password: ${{ secrets.SITEGROUND_SFTP_PASSWORD }}
          port: ${{ secrets.SITEGROUND_SFTP_PORT || 22 }}
          local-dir: ./dist/
          server-dir: ./public_html/
          state-name: .ftp-deploy-sync-state.json
