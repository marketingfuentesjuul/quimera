# -----------------------------------------------------------------------------
# QUIMERA SITE - AUTOMATED DEPLOYMENT WORKFLOW (GITHUB ACTIONS)
# Este workflow se ejecuta automáticamente ante cada push a la rama 'main'.
# Compila la aplicación de React y sube los archivos al servidor Hostinger via FTP.
# -----------------------------------------------------------------------------

name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧰 Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build React App
        run: npm run build

      - name: 🚀 Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./dist/
          dangerous-clean-slate: true

