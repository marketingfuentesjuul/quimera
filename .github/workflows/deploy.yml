# -----------------------------------------------------------------------------
# QUIMERA SITE - AUTOMATED DEPLOYMENT WORKFLOW (GITHUB ACTIONS)
# Este workflow se ejecuta automáticamente ante cada push a la rama 'main'.
# Compila la aplicación de React y sube los archivos al servidor SiteGround via rsync.
# -----------------------------------------------------------------------------

name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧰 Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build React App
        run: npm run build

      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🧪 Test SSH Connection (Debug)
        run: |
          OUTPUT=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ls -la ~/www/ || true" | tr '\n' ' ')
          echo "::warning file=.github,line=1::Remote directories: $OUTPUT"

      - name: 🚀 Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/www/quimeracg.cl/public_html/
